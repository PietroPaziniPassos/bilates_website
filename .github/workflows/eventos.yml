name: Atualizar eventos

on:
  schedule:
    # 12h20 em Brasília. Minuto fora da hora cheia porque o GitHub atrasa muito o cron das :00.
    - cron: "20 15 * * *"
    # Segunda, 0h30 em Brasília: refaz o arquivo inteiro (tira evento que saiu da loja).
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      completo:
        description: "Refazer o arquivo inteiro (todas as páginas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # O script só usa zod e tsx: npm ci do projeto inteiro (Next, SWC, ESLint) levava 5 min.
      # Versões lidas do lockfile, instaladas fora do repo e ligadas por symlink.
      - name: Instalar dependências do script
        run: |
          v() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/deps" "zod@$(v zod)" "tsx@$(v tsx)"
          ln -s "$RUNNER_TEMP/deps/node_modules" node_modules

      - name: Buscar eventos na Foco
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * 1" ] || [ "${{ inputs.completo }}" = "true" ]; then
            npm run eventos:completo
          else
            npm run eventos
          fi

      - name: Commitar se mudou
        run: |
          if git diff --quiet data/eventos.json; then
            echo "Nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventos.json
          git commit -m "chore(eventos): atualiza a lista de eventos das lojas"
          git push
